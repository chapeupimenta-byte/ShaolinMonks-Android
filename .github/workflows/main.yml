name: Build Shaolin Monks ARMv7a

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install CMake 3.31.6 and Ninja
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang curl grep
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager "cmake;3.31.6"

      - name: Download ISO and Extract default.xbe
        env:
          MEDIAFIRE_URL: ${{ secrets.ISO_URL }}
        run: |
          if [ -z "$MEDIAFIRE_URL" ]; then
            echo "ERRO: O Secret ISO_URL está vazio!"
            exit 1
          fi
          mkdir -p assets
          DIRECT_URL=$(python3 -c "import os, re, urllib.request; req = urllib.request.Request(os.environ['MEDIAFIRE_URL'], headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}); html = urllib.request.urlopen(req).read().decode('utf-8', 'ignore'); m = re.search(r'href=\"(https?://download[^\"]+)\"', html); print(m.group(1) if m else '')")
          if [ -z "$DIRECT_URL" ]; then
            echo "ERRO: Não foi possível extrair o link direto do MediaFire."
            exit 1
          fi
          echo "Baixando ISO..."
          curl -L -A "Mozilla/5.0" "$DIRECT_URL" -o game.iso
          python3 -I tools/xdvdfs.py game.iso default.xbe assets/default.xbe
          rm -f game.iso




      - name: Build Recompiler Tools & Recompile XBE
        run: |
          cmake -S tools -B out/build/android-tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build out/build/android-tools
          SDK=$(cat out/build/android-tools/sdk_dir.txt)
          if ! grep -q "^\[symbols\]" config/game.toml; then
            ./out/build/android-tools/xbe_symbols assets/default.xbe "$SDK/xdk" --out config/game.toml
          fi
          ./out/build/android-tools/xbe_recomp config/game.toml --xdk "$SDK/xdk"

      - name: Build Android APK (armeabi-v7a)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShaolinMonks-armv7a-debug
          path: app/build/outputs/apk/debug/*.apk
